<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Password help · AuraMarket</title><link rel="stylesheet" href="/static/demo.css"></head>
<body class="demo-body"><div class="auth-page"><header class="auth-header"><div class="demo-container auth-header-row"><a class="am-logo" href="/demo/">Aura<span>Market</span></a><a class="demo-pill" href="/demo/login">Back to sign in</a></div></header><main class="auth-main"><div class="auth-heading"><div class="eyebrow">Account help</div><h1>Reset your password</h1><p>We’ll send a demo reset link to your inbox.</p></div><section class="auth-card">{% if sent %}<div class="security-note" style="color:#14804a;background:#effaf3">A demo reset link was sent to <strong>{{ email }}</strong>.</div><a class="am-btn am-btn-primary auth-submit" href="/demo/login">Return to sign in</a>{% else %}<form method="post" action="/demo/forgot-password"><div class="field"><label>Email address</label><input name="email" type="email" required placeholder="sarah@example.com"></div><button class="am-btn am-btn-primary auth-submit" type="submit">Send reset link</button></form>{% endif %}</section></main></div></body></html>
