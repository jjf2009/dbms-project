<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · SIEM Log Engine</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth">
    <h1>🛡 SIEM Log Engine</h1>
    <p class="sub">Security operations console — sign in</p>
    <div class="card">
      {% if error %}<div class="err">{{ error }}</div>{% endif %}
      <form method="post" action="/siem/login">
        <div><label>Username</label><input name="username" autofocus></div>
        <div><label>Password</label><input name="password" type="password"></div>
        <button type="submit">Sign in</button>
      </form>
    </div>
    <div class="card" style="margin-top:12px">
      <h3>Demo operators</h3>
      <table><tbody>
        <tr><td>Admin</td><td class="mono">admin</td><td class="mono">admin123</td></tr>
        <tr><td>Analyst</td><td class="mono">analyst</td><td class="mono">analyst123</td></tr>
        <tr><td>Viewer</td><td class="mono">viewer</td><td class="mono">viewer123</td></tr>
      </tbody></table>
      <p class="muted" style="margin:10px 0 0">Or visit the <a href="/demo/">demo website →</a></p>
    </div>
  </div>
</div>
</body>
</html>
