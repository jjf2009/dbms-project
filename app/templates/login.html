<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Aegis SIEM</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="siem-login-page">
<div class="auth-wrap">
  <div class="auth">
    <div class="auth-brand"><span class="auth-mark">✦</span><span>Aegis SIEM</span></div>
    <p class="auth-eyebrow">Security operations console</p>
    <h1>Welcome back</h1>
    <p class="sub">Sign in to monitor your security perimeter.</p>
    <div class="card">
      {% if error %}<div class="err">{{ error }}</div>{% endif %}
      <form method="post" action="/siem/login">
        <div><label for="username">Username</label><input id="username" name="username" autocomplete="username" autofocus></div>
        <div><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password"></div>
        <button type="submit">Sign in to console</button>
      </form>
    </div>
    <div class="card" style="margin-top:12px">
      <h3>Demo access</h3>
      <table><tbody>
        <tr><td>Admin</td><td class="mono">admin</td><td class="mono">admin123</td></tr>
        <tr><td>Analyst</td><td class="mono">analyst</td><td class="mono">analyst123</td></tr>
        <tr><td>Viewer</td><td class="mono">viewer</td><td class="mono">viewer123</td></tr>
      </tbody></table>
      <p class="muted" style="margin:10px 0 0">Need the storefront? <a href="/demo/">Open demo website →</a></p>
    </div>
  </div>
</div>
</body>
</html>
